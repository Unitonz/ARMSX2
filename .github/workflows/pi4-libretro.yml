name: Raspberry Pi 4 libretro Vulkan allocation trace

on:
  workflow_dispatch:

jobs:
  build-pi4-libretro:
    name: Build ARMSX2 Pi4 Vulkan allocation trace
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 9
      CCACHE_MAXSIZE: 100M

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply Vulkan allocation tracing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tex = Path('pcsx2/GS/Renderers/Vulkan/GSTextureVK.cpp')
          s = tex.read_text()

          old = '#include "common/BitUtils.h"\n\n'
          new = '#include "common/BitUtils.h"\n\n#include <atomic>\n\n'
          if old not in s:
              raise SystemExit('GSTextureVK include anchor not found')
          s = s.replace(old, new, 1)

          anchor = 'static VkImageLayout GetVkImageLayout(GSTextureVK::Layout layout)\n'
          counters = '''static std::atomic<u64> s_pi4_img_create_count{0};
          static std::atomic<u64> s_pi4_img_create_bytes{0};
          static std::atomic<u64> s_pi4_img_destroy_count{0};
          static std::atomic<u64> s_pi4_img_destroy_bytes{0};

          '''
          if anchor not in s:
              raise SystemExit('GSTextureVK counter anchor not found')
          s = s.replace(anchor, counters + anchor, 1)

          anchor = '\n\tVkImageView view = VK_NULL_HANDLE;\n'
          create_log = '''
\tVmaAllocationInfo pi4_ai{};
\tvmaGetAllocationInfo(GSDeviceVK::GetInstance()->GetAllocator(), allocation, &pi4_ai);
\tconst u64 pi4_size = static_cast<u64>(pi4_ai.size);
\tconst u64 pi4_create_count = s_pi4_img_create_count.fetch_add(1, std::memory_order_relaxed) + 1;
\tconst u64 pi4_create_bytes = s_pi4_img_create_bytes.fetch_add(pi4_size, std::memory_order_relaxed) + pi4_size;
\tif ((pi4_create_count & 0xffu) == 0u)
\t{
\t\tConsole.WriteLn("[PI4MEM] IMG_CREATE count=%llu total_kb=%llu last_kb=%llu usage=%u format=%u size=%dx%d levels=%d",
\t\t\tstatic_cast<unsigned long long>(pi4_create_count),
\t\t\tstatic_cast<unsigned long long>(pi4_create_bytes / 1024),
\t\t\tstatic_cast<unsigned long long>(pi4_size / 1024),
\t\t\tstatic_cast<unsigned>(usage), static_cast<unsigned>(format), width, height, levels);
\t}
'''
          if anchor not in s:
              raise SystemExit('GSTextureVK create anchor not found')
          s = s.replace(anchor, create_log + anchor, 1)

          old = '''\tif (m_allocation != VK_NULL_HANDLE)\n\t{\n\t\tif (defer)\n\t\t\tGSDeviceVK::GetInstance()->DeferImageDestruction(m_image, m_allocation);\n\t\telse\n\t\t\tvmaDestroyImage(GSDeviceVK::GetInstance()->GetAllocator(), m_image, m_allocation);\n'''
          new = '''\tif (m_allocation != VK_NULL_HANDLE)\n\t{\n\t\tVmaAllocationInfo pi4_ai{};\n\t\tvmaGetAllocationInfo(GSDeviceVK::GetInstance()->GetAllocator(), m_allocation, &pi4_ai);\n\t\tconst u64 pi4_size = static_cast<u64>(pi4_ai.size);\n\t\tconst u64 pi4_destroy_count = s_pi4_img_destroy_count.fetch_add(1, std::memory_order_relaxed) + 1;\n\t\tconst u64 pi4_destroy_bytes = s_pi4_img_destroy_bytes.fetch_add(pi4_size, std::memory_order_relaxed) + pi4_size;\n\t\tif ((pi4_destroy_count & 0xffu) == 0u)\n\t\t{\n\t\t\tConsole.WriteLn("[PI4MEM] IMG_DESTROY_LOGICAL count=%llu total_kb=%llu last_kb=%llu",\n\t\t\t\tstatic_cast<unsigned long long>(pi4_destroy_count),\n\t\t\t\tstatic_cast<unsigned long long>(pi4_destroy_bytes / 1024),\n\t\t\t\tstatic_cast<unsigned long long>(pi4_size / 1024));\n\t\t}\n\n\t\tif (defer)\n\t\t\tGSDeviceVK::GetInstance()->DeferImageDestruction(m_image, m_allocation);\n\t\telse\n\t\t\tvmaDestroyImage(GSDeviceVK::GetInstance()->GetAllocator(), m_image, m_allocation);\n'''
          if old not in s:
              raise SystemExit('GSTextureVK destroy anchor not found')
          s = s.replace(old, new, 1)
          tex.write_text(s)

          dev = Path('pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp')
          s = dev.read_text()

          old = '#include <bit>\n'
          new = '#include <atomic>\n#include <bit>\n'
          if old not in s:
              raise SystemExit('GSDeviceVK include anchor not found')
          s = s.replace(old, new, 1)

          anchor = '\n#ifdef ENABLE_OGL_DEBUG\n'
          counters = '''
static std::atomic<u64> s_pi4_defer_buffer_count{0};
static std::atomic<u64> s_pi4_free_buffer_count{0};
static std::atomic<u64> s_pi4_pending_buffer_count{0};
static std::atomic<u64> s_pi4_pending_buffer_bytes{0};
static std::atomic<u64> s_pi4_defer_image_count{0};
static std::atomic<u64> s_pi4_free_image_count{0};
static std::atomic<u64> s_pi4_pending_image_count{0};
static std::atomic<u64> s_pi4_pending_image_bytes{0};
'''
          if anchor not in s:
              raise SystemExit('GSDeviceVK counter anchor not found')
          s = s.replace(anchor, '\n' + counters + anchor, 1)

          old = '''void GSDeviceVK::DeferBufferDestruction(VkBuffer object, VmaAllocation allocation)\n{\n\tFrameResources& resources = m_frame_resources[m_current_frame];\n\tresources.cleanup_resources.push_back(\n\t\t[this, object, allocation]() { vmaDestroyBuffer(m_allocator, object, allocation); });\n}\n'''
          new = '''void GSDeviceVK::DeferBufferDestruction(VkBuffer object, VmaAllocation allocation)\n{\n\tVmaAllocationInfo ai{};\n\tvmaGetAllocationInfo(m_allocator, allocation, &ai);\n\tconst u64 bytes = static_cast<u64>(ai.size);\n\tconst u64 scheduled = s_pi4_defer_buffer_count.fetch_add(1, std::memory_order_relaxed) + 1;\n\tconst u64 pending_count = s_pi4_pending_buffer_count.fetch_add(1, std::memory_order_relaxed) + 1;\n\tconst u64 pending_bytes = s_pi4_pending_buffer_bytes.fetch_add(bytes, std::memory_order_relaxed) + bytes;\n\tif ((scheduled & 0xffu) == 0u)\n\t{\n\t\tConsole.WriteLn("[PI4MEM] BUF_DEFER scheduled=%llu pending=%llu pending_kb=%llu last_kb=%llu",\n\t\t\tstatic_cast<unsigned long long>(scheduled), static_cast<unsigned long long>(pending_count),\n\t\t\tstatic_cast<unsigned long long>(pending_bytes / 1024), static_cast<unsigned long long>(bytes / 1024));\n\t}\n\n\tFrameResources& resources = m_frame_resources[m_current_frame];\n\tresources.cleanup_resources.push_back([this, object, allocation, bytes]() {\n\t\tvmaDestroyBuffer(m_allocator, object, allocation);\n\t\tconst u64 freed = s_pi4_free_buffer_count.fetch_add(1, std::memory_order_relaxed) + 1;\n\t\tconst u64 pending_after = s_pi4_pending_buffer_count.fetch_sub(1, std::memory_order_relaxed) - 1;\n\t\tconst u64 bytes_after = s_pi4_pending_buffer_bytes.fetch_sub(bytes, std::memory_order_relaxed) - bytes;\n\t\tif ((freed & 0xffu) == 0u)\n\t\t{\n\t\t\tConsole.WriteLn("[PI4MEM] BUF_FREE freed=%llu pending=%llu pending_kb=%llu",\n\t\t\t\tstatic_cast<unsigned long long>(freed), static_cast<unsigned long long>(pending_after),\n\t\t\t\tstatic_cast<unsigned long long>(bytes_after / 1024));\n\t\t}\n\t});\n}\n'''
          if old not in s:
              raise SystemExit('DeferBufferDestruction anchor not found')
          s = s.replace(old, new, 1)

          old = '''void GSDeviceVK::DeferImageDestruction(VkImage object, VmaAllocation allocation)\n{\n\tFrameResources& resources = m_frame_resources[m_current_frame];\n\tresources.cleanup_resources.push_back(\n\t\t[this, object, allocation]() { vmaDestroyImage(m_allocator, object, allocation); });\n}\n'''
          new = '''void GSDeviceVK::DeferImageDestruction(VkImage object, VmaAllocation allocation)\n{\n\tVmaAllocationInfo ai{};\n\tvmaGetAllocationInfo(m_allocator, allocation, &ai);\n\tconst u64 bytes = static_cast<u64>(ai.size);\n\tconst u64 scheduled = s_pi4_defer_image_count.fetch_add(1, std::memory_order_relaxed) + 1;\n\tconst u64 pending_count = s_pi4_pending_image_count.fetch_add(1, std::memory_order_relaxed) + 1;\n\tconst u64 pending_bytes = s_pi4_pending_image_bytes.fetch_add(bytes, std::memory_order_relaxed) + bytes;\n\tif ((scheduled & 0xffu) == 0u)\n\t{\n\t\tConsole.WriteLn("[PI4MEM] IMG_DEFER scheduled=%llu pending=%llu pending_kb=%llu last_kb=%llu",\n\t\t\tstatic_cast<unsigned long long>(scheduled), static_cast<unsigned long long>(pending_count),\n\t\t\tstatic_cast<unsigned long long>(pending_bytes / 1024), static_cast<unsigned long long>(bytes / 1024));\n\t}\n\n\tFrameResources& resources = m_frame_resources[m_current_frame];\n\tresources.cleanup_resources.push_back([this, object, allocation, bytes]() {\n\t\tvmaDestroyImage(m_allocator, object, allocation);\n\t\tconst u64 freed = s_pi4_free_image_count.fetch_add(1, std::memory_order_relaxed) + 1;\n\t\tconst u64 pending_after = s_pi4_pending_image_count.fetch_sub(1, std::memory_order_relaxed) - 1;\n\t\tconst u64 bytes_after = s_pi4_pending_image_bytes.fetch_sub(bytes, std::memory_order_relaxed) - bytes;\n\t\tif ((freed & 0xffu) == 0u)\n\t\t{\n\t\t\tConsole.WriteLn("[PI4MEM] IMG_FREE freed=%llu pending=%llu pending_kb=%llu",\n\t\t\t\tstatic_cast<unsigned long long>(freed), static_cast<unsigned long long>(pending_after),\n\t\t\t\tstatic_cast<unsigned long long>(bytes_after / 1024));\n\t\t}\n\t});\n}\n'''
          if old not in s:
              raise SystemExit('DeferImageDestruction anchor not found')
          s = s.replace(old, new, 1)

          old = '''void GSDeviceVK::CommandBufferCompleted(u32 index)\n{\n\tFrameResources& resources = m_frame_resources[index];\n\n\tfor (auto& it : resources.cleanup_resources)\n'''
          new = '''void GSDeviceVK::CommandBufferCompleted(u32 index)\n{\n\tFrameResources& resources = m_frame_resources[index];\n\n\tif (resources.cleanup_resources.size() >= 128)\n\t{\n\t\tConsole.WriteLn("[PI4MEM] CLEANUP frame=%u callbacks=%zu pending_img=%llu pending_img_kb=%llu pending_buf=%llu pending_buf_kb=%llu",\n\t\t\tindex, resources.cleanup_resources.size(),\n\t\t\tstatic_cast<unsigned long long>(s_pi4_pending_image_count.load(std::memory_order_relaxed)),\n\t\t\tstatic_cast<unsigned long long>(s_pi4_pending_image_bytes.load(std::memory_order_relaxed) / 1024),\n\t\t\tstatic_cast<unsigned long long>(s_pi4_pending_buffer_count.load(std::memory_order_relaxed)),\n\t\t\tstatic_cast<unsigned long long>(s_pi4_pending_buffer_bytes.load(std::memory_order_relaxed) / 1024));\n\t}\n\n\tfor (auto& it : resources.cleanup_resources)\n'''
          if old not in s:
              raise SystemExit('CommandBufferCompleted anchor not found')
          s = s.replace(old, new, 1)
          dev.write_text(s)

          print('Pi4 Vulkan allocation tracing injected successfully')
          PY

      - name: Install packages
        run: |
          tools/retry.sh wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo tools/retry.sh apt-add-repository -n 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main'
          sudo tools/retry.sh apt-get update
          sudo tools/retry.sh apt-get -y install \
            build-essential ccache clang-17 cmake curl git lld-17 llvm-17 ninja-build nasm patchelf pkg-config zstd zlib1g-dev \
            libasound2-dev libaio-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libegl-dev libevdev-dev libgbm-dev \
            libgudev-1.0-dev libinput-dev libopengl-dev libpcap-dev libpipewire-0.3-dev libpulse-dev libssl-dev libudev-dev \
            libwayland-dev libx11-dev

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ~/deps
          key: pi4-armv8-deps-${{ hashFiles('.github/workflows/scripts/linux/build-dependencies-runner.sh', '.github/workflows/scripts/common/*.patch') }}

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: .github/workflows/scripts/linux/build-dependencies-runner.sh "$HOME/deps"

      - name: Configure for Raspberry Pi 4 ARMv8.0
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_PREFIX_PATH="$HOME/deps" \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_FLAGS="-march=armv8-a -moutline-atomics" \
            -DCMAKE_CXX_FLAGS="-march=armv8-a -moutline-atomics" \
            -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_QT_UI=OFF \
            -DENABLE_SDL_FRONTEND=OFF \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_GSRUNNER=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_RECOMPILER_TEST_HOOKS=OFF \
            -DENABLE_SETCAP=OFF \
            -DUSE_BACKTRACE=OFF \
            -DX11_API=OFF \
            -DWAYLAND_API=OFF \
            -DDISABLE_ADVANCE_SIMD=TRUE \
            -DOVERRIDE_HOST_PAGE_SIZE=4096 \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Build core
        working-directory: build
        run: ninja pcsx2-libretro

      - name: Verify and package
        run: |
          SO=$(find build -name 'armsx2_libretro.so' | head -1)
          test -n "$SO" || { echo "armsx2_libretro.so not found"; exit 1; }
          strip --strip-unneeded "$SO"
          mkdir -p out
          cp -v "$SO" out/armsx2_libretro.so
          file out/armsx2_libretro.so

      - name: Upload Raspberry Pi 4 Vulkan allocation trace core
        uses: actions/upload-artifact@v7
        with:
          name: armsx2-libretro-raspberry-pi4-vkalloc-trace-armv8
          path: out/armsx2_libretro.so
          if-no-files-found: error
